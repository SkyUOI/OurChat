syntax = "proto3";

package service.ourchat.download.v1;

message DownloadRequest {
  // The unique key of the file
  string key = 1;
}

// Metadata about the file, sent as the first response before data
message FileMetadata {
  // MIME content type (e.g. "image/png", "video/mp4")
  string content_type = 1;
  // Original filename
  string filename = 2;
  // File size in bytes
  uint64 size = 3;
}

message DownloadResponse {
  oneof data {
    // File metadata (sent first, before any data chunks)
    FileMetadata metadata = 2;
    // A chunk of the file data
    bytes content = 1;
  }
}
