# Debian CI test stack: builds the test image (source tree staged inside,
# no cargo build at image build time), starts the dependencies and idles,
# so the CI runner can `docker compose exec OurChatServer sh -c "cd /app
# && cargo test"`. Everything common lives in compose.base.yml (issue
# #336). Test data is deliberately ephemeral — no volumes for db/redis/mq.
name: ourchat_server_test_debian
include:
  - compose.base.yml

services:
  OurChatServer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test-debian
    image: test-ourchat-debian:latest
    environment:
      - OURCHAT_CONFIG_FILE=/app/docker/config/ourchat.toml
      - OURCHAT_LOG=trace,mio=off,h2=off,tonic=off,tower=off,tokio::task::waker=off,runtime::resource=off,actix_http=off,lapin=off,hyper_util=off,pinky_swear=off,async_io=off,polling=off
    command: tail -f /dev/null
    volumes:
      # OURCHAT_CONFIG_FILE points into the source tree staged at /app
      # (/app/docker/config), whose http.toml references /app/resource/...,
      # so the repo assets must be mounted at /app/resource. This used to
      # be mounted at /root/resource, which that config never looked at.
      - ../resource/:/app/resource
    # base.yml defines an HTTP healthcheck probe; a `tail -f /dev/null`
    # test container never serves /v1/status, so disable the probe instead
    # of having the container reported unhealthy forever.
    healthcheck:
      disable: true

  # Non-alpine dependency images, matching the debian flavour of the test
  # image (base.yml defaults to the alpine variants).
  db:
    image: postgres:18
    # Every parallel cargo test spins a full server instance with its own
    # sqlx pool (up to 10 connections each) — the default 100 connections
    # run out on many-core runners and surface as random test failures.
    command: postgres -c max_connections=400
  redis:
    image: redis:8
  mq:
    image: rabbitmq:4-management
