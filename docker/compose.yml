# Alpine production stack. Just a template — change the passwords before
# any real deployment. Everything common lives in compose.base.yml
# (issue #336); this file only adds the alpine image tags, the published
# ports and the persistent named volumes (issues #337 and #342).
name: ourchat_server

services:
  OurChatServer:
    extends:
      file: compose.base.yml
      service: OurChatServer
    image: skyuoi/ourchat:nightly
    restart: unless-stopped
    ports:
      # Loopback-only by default (issue #342): the server speaks plaintext
      # HTTP/gRPC unless TLS is enabled in the config, so it should sit
      # behind a reverse proxy on the same host. To expose it on the
      # network instead, drop the 127.0.0.1 prefix:
      #   - "7777:7777"
      #   - "7779:7779"
      # or bind a specific interface: - "192.168.1.10:7777:7777"
      - "127.0.0.1:7777:7777" # HTTP / WebSocket
      - "127.0.0.1:7779:7779" # gRPC
    volumes:
      # Server configuration. A fresh volume is seeded from the image's
      # built-in /etc/ourchat on first use (no `nocopy`), so the stack
      # works out of the box; afterwards edit the copy inside the volume,
      # e.g. `docker cp` + `docker compose restart OurChatServer` (see
      # README). Note: image upgrades no longer overwrite your config.
      - ourchat_config:/etc/ourchat
      - ourchat_log:/app/log
      # User-uploaded files. Previously not mounted at all, so everything
      # was silently lost with the container (issue #337).
      - ourchat_files_storage:/app/files_storage
      # Static assets (logo, e-mail template, web panel). Kept as a
      # read-only bind mount on purpose: these are versioned inputs edited
      # from the host, not runtime state, so they do not belong in a
      # docker volume.
      - ../resource/:/app/resource:ro

  db:
    extends:
      file: compose.base.yml
      service: db
    volumes:
      # NOTE: postgres 18+ moved PGDATA from /var/lib/postgresql/data to
      # /var/lib/postgresql/18/docker by default. Do not change this path.
      - ourchat_postgres_data:/var/lib/postgresql/18/docker
    # If you want to expose the postgres port, uncomment the following lines
    # (keep the 127.0.0.1 prefix unless you really mean to expose it,
    # see issue #342)
    # ports:
    #   - "127.0.0.1:5432:5432"

  redis:
    extends:
      file: compose.base.yml
      service: redis
    volumes:
      - ourchat_redis_data:/data

  mq:
    extends:
      file: compose.base.yml
      service: mq
    volumes:
      - ourchat_rabbitmq_data:/var/lib/rabbitmq
    # If you want to expose the rabbitmq management port, uncomment the
    # following lines (loopback-only, see issue #342)
    # ports:
    #   - "127.0.0.1:5672:5672"
    #   - "127.0.0.1:15672:15672"

# All runtime state lives in named volumes (issue #337): `docker compose
# down` and image upgrades keep the data; `docker compose down -v` (or
# `docker volume rm`) is the explicit, visible way to wipe it.
volumes:
  ourchat_config:
  ourchat_log:
  ourchat_files_storage:
  ourchat_postgres_data:
  ourchat_redis_data:
  ourchat_rabbitmq_data:

networks:
  net:
    driver: bridge
