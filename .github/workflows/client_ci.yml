name: Client CI

on:
  push:
    branches: ["main", "dev", "ci_fix"]
  pull_request:
    branches: ["main", "dev"]
permissions:
  contents: read
  pull-requests: write
  actions: write

env:
  CARGO_TERM_COLOR: always

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: "always"
          paths_ignore: '["server/**"]'

  common-ci:
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Git PAT Auth
        env:
          PAT: ${{ secrets.PAT }}
        shell: pwsh
        run: |
          git config --global url."https://${PAT}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${PAT}@github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          version: "32.x"
      - name: Flutter Init
        run: cd client && flutter pub get
      - name: Flutter Fmt
        run: |
          cd client
          dart format lib/l10n/app_localizations.dart
          dart format ./ --set-exit-if-changed
      - name: Grpc generate
        run: dart pub global activate protoc_plugin 25.0.0 && python script/generate.pb.dart.py
      - name: Drift generate
        run: cd client && dart run build_runner build
      - name: Flutter Check
        run: cd client && flutter analyze
      - name: Flutter Test
        run: cd client && flutter test
      - name: Flutter Integration Test
        uses: coactions/setup-xvfb@v1
        with:
          run: cd client && flutter test integration_test
      - name: Flutter Web Build Test
        run: cd client && flutter build web

  flutter-web-integration:
    # Runs the web-specific integration tests in a real Chrome via
    # chromedriver + `flutter drive`. These exercise browser-only behavior
    # the VM test run cannot see (JS number precision, wasm sqlite, gRPC-Web
    # transports). Tests that need a live server skip themselves.
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Git PAT Auth
        env:
          PAT: ${{ secrets.PAT }}
        shell: pwsh
        run: |
          git config --global url."https://${PAT}@github.com/".insteadOf "https://github.com/"
          git config --global url."https://${PAT}@github.com/".insteadOf "git@github.com:"
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Flutter Init
        run: cd client && flutter pub get
      - name: Start chromedriver
        run: |
          # ubuntu-latest ships Chrome and a matching chromedriver.
          chromedriver --version
          chromedriver --port=4444 &
          echo " Waiting for chromedriver…"
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:4444/status >/dev/null && break
            sleep 1
          done
      - name: Web integration tests (Chrome)
        uses: coactions/setup-xvfb@v1
        with:
          run: |
            cd client
            for target in web_int64_precision_test web_keygen_test web_grpcweb_error_test; do
              echo "==> driving $target"
              flutter drive \
                --profile \
                --driver=test_driver/integration_test.dart \
                --target=integration_test/$target.dart \
                -d chrome
            done

