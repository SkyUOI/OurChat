include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # These should be fixed or ignored in the proto generator
    implementation_imports: ignore
    use_super_parameters: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

plugins:
  riverpod_lint: 3.1.3